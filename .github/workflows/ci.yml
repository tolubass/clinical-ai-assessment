name: Clinical AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # API tests (tests/test_api.py) require the trained BioBERT
          # model artifact which is not stored in the repository.
          # Run full test suite locally after training: python -m pytest tests/ -v
          python -m pytest tests/test_preprocessing.py tests/test_guideline_engine.py -v
